<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Flappy Tom — HD</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050914;
  font-family:Segoe UI,Arial,sans-serif;
  touch-action:none;
  user-select:none;
}

#gameWrap{
  width:100vw;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
  overflow:hidden;
}

canvas{
  display:block;
  max-width:100vw;
  max-height:100vh;
  touch-action:none;
}

#hud{
  position:absolute;
  inset:0;
  pointer-events:none;
}

#score{
  position:absolute;
  top:4%;
  left:50%;
  transform:translateX(-50%);
  color:white;
  font-size:min(11vw,58px);
  font-weight:1000;
  letter-spacing:2px;
  text-shadow:
    0 4px 0 #23304a,
    0 7px 15px rgba(0,0,0,.4);
}

.screen{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
  color:white;
  background:rgba(3,8,22,.38);
  backdrop-filter:blur(5px);
  pointer-events:auto;
}

#gameOverScreen{
  display:none;
}

.logoCat{
  font-size:min(24vw,125px);
  filter:
    drop-shadow(0 12px 5px rgba(0,0,0,.35));
  animation:float 2s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0) rotate(-3deg)}
  50%{transform:translateY(-12px) rotate(3deg)}
}

.title{
  margin:5px 0;
  font-size:min(14vw,72px);
  font-weight:1000;
  letter-spacing:3px;
  color:#ffe45c;
  -webkit-text-stroke:3px #713800;
  text-shadow:
    0 6px 0 #713800,
    0 10px 20px rgba(0,0,0,.35);
}

.subtitle{
  margin:12px 0 26px;
  font-size:min(4.8vw,21px);
  font-weight:600;
  opacity:.95;
}

button{
  border:0;
  padding:15px 42px;
  border-radius:50px;
  font-size:min(6vw,29px);
  font-weight:1000;
  color:#542700;
  background:linear-gradient(#ffe96a,#ffb82e);
  box-shadow:
    0 7px 0 #9a5200,
    0 13px 25px rgba(0,0,0,.3);
  cursor:pointer;
}

button:active{
  transform:translateY(5px);
  box-shadow:0 2px 0 #9a5200;
}

.stat{
  margin:8px;
  font-size:min(5.5vw,25px);
  font-weight:800;
}

.best{
  color:#ffe66a;
}

#hint{
  position:absolute;
  bottom:2%;
  width:100%;
  text-align:center;
  color:white;
  opacity:.7;
  font-size:min(3.5vw,16px);
}
</style>
</head>

<body>

<div id="gameWrap">
  <canvas id="game"></canvas>

  <div id="hud">

    <div id="score">0</div>

    <div id="startScreen" class="screen">
      <div class="logoCat">🐱</div>
      <div class="title">FLAPPY TOM</div>
      <div class="subtitle">
        Tap, click or press SPACE to fly
      </div>

      <button id="startBtn">▶ PLAY</button>

      <div class="stat" style="margin-top:25px">
        BEST:
        <span id="bestStart" class="best">0</span>
      </div>
    </div>

    <div id="gameOverScreen" class="screen">

      <div style="
        font-size:min(11vw,58px);
        font-weight:1000;
        color:#ff6666;
        text-shadow:0 5px 0 #700000;
      ">
        GAME OVER
      </div>

      <div class="stat">
        SCORE:
        <span id="finalScore">0</span>
      </div>

      <div class="stat">
        BEST:
        <span id="bestScore" class="best">0</span>
      </div>

      <button id="restartBtn" style="margin-top:18px">
        ↻ RETRY
      </button>
    </div>

    <div id="hint">
      Mobile: tap anywhere • Desktop: Space / ↑
    </div>

  </div>
</div>

<script>
(() => {

"use strict";

/* =========================================================
   SETUP
========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score");
const startScreen = document.getElementById("startScreen");
const gameOverScreen = document.getElementById("gameOverScreen");

const startBtn = document.getElementById("startBtn");
const restartBtn = document.getElementById("restartBtn");

const finalScoreEl = document.getElementById("finalScore");
const bestScoreEl = document.getElementById("bestScore");
const bestStartEl = document.getElementById("bestStart");

let W = 380;
let H = 675;
let DPR = 1;

function resize(){

  DPR = Math.min(window.devicePixelRatio || 1,2);

  const screenW = innerWidth;
  const screenH = innerHeight;

  const aspect = 9/16;

  let w = screenW;
  let h = w/aspect;

  if(h > screenH){
    h = screenH;
    w = h*aspect;
  }

  canvas.style.width = w+"px";
  canvas.style.height = h+"px";

  canvas.width = Math.floor(w*DPR);
  canvas.height = Math.floor(h*DPR);

  ctx.setTransform(DPR,0,0,DPR,0,0);

  W = w;
  H = h;
}

window.addEventListener("resize",resize);
resize();

const S = n => n*(W/380);

/* =========================================================
   GAME STATE
========================================================= */

let state = "start";

let tom;
let pipes = [];
let particles = [];
let clouds = [];
let stars = [];

let score = 0;

let best =
  Number(localStorage.getItem("flappyTomHD") || 0);

bestStartEl.textContent = best;

let lastTime = 0;
let elapsed = 0;
let pipeTimer = 0;

let shake = 0;
let flash = 0;

/* =========================================================
   INITIAL WORLD
========================================================= */

function createClouds(){

  clouds = [];

  for(let i=0;i<9;i++){

    clouds.push({
      x:Math.random()*W,
      y:S(35+Math.random()*230),
      size:S(18+Math.random()*28),
      speed:10+Math.random()*18,
      alpha:.3+Math.random()*.45
    });

  }
}

function createStars(){

  stars=[];

  for(let i=0;i<45;i++){

    stars.push({
      x:Math.random()*W,
      y:Math.random()*H*.45,
      r:S(.5+Math.random()*1.8),
      phase:Math.random()*Math.PI*2
    });

  }
}

createClouds();
createStars();

/* =========================================================
   RESET
========================================================= */

function resetGame(){

  tom = {
    x:W*.28,
    y:H*.42,
    vy:0,
    rotation:0,
    wing:0
  };

  pipes=[];
  particles=[];

  score=0;

  pipeTimer=0;
  elapsed=0;

  shake=0;
  flash=0;

  scoreEl.textContent="0";
}

/* =========================================================
   AUDIO
========================================================= */

let audioCtx=null;

function audio(){

  if(!audioCtx){
    try{
      audioCtx =
        new (window.AudioContext ||
        window.webkitAudioContext)();
    }catch(e){}
  }
}

function sound(freq,duration,type="sine"){

  if(!audioCtx)return;

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type=type;
  osc.frequency.value=freq;

  gain.gain.setValueAtTime(.0001,audioCtx.currentTime);

  gain.gain.exponentialRampToValueAtTime(
    .08,
    audioCtx.currentTime+.01
  );

  gain.gain.exponentialRampToValueAtTime(
    .0001,
    audioCtx.currentTime+duration
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  osc.stop(audioCtx.currentTime+duration);
}

/* =========================================================
   INPUT
========================================================= */

function flap(){

  audio();

  if(audioCtx && audioCtx.state==="suspended"){
    audioCtx.resume();
  }

  if(state==="start"){
    startGame();
    return;
  }

  if(state!=="playing")return;

  tom.vy=-S(440);

  tom.wing=1;

  sound(520,.08,"square");

  createFlapParticles();
}

function pointer(e){

  e.preventDefault();
  flap();
}

canvas.addEventListener("pointerdown",pointer);

document.addEventListener("keydown",e=>{

  if(
    e.code==="Space" ||
    e.code==="ArrowUp"
  ){

    e.preventDefault();
    flap();

  }

});

startBtn.onclick=e=>{
  e.stopPropagation();
  startGame();
};

restartBtn.onclick=e=>{
  e.stopPropagation();
  startGame();
};

/* =========================================================
   START / GAME OVER
========================================================= */

function startGame(){

  resetGame();

  state="playing";

  startScreen.style.display="none";
  gameOverScreen.style.display="none";

  spawnPipe(true);
}

function gameOver(){

  if(state!=="playing")return;

  state="over";

  shake=S(12);
  flash=1;

  sound(100,.25,"sawtooth");

  if(score>best){

    best=score;

    localStorage.setItem(
      "flappyTomHD",
      best
    );

  }

  finalScoreEl.textContent=score;
  bestScoreEl.textContent=best;

  setTimeout(()=>{
    gameOverScreen.style.display="flex";
  },350);
}

/* =========================================================
   PIPE GENERATION
========================================================= */

function spawnPipe(first=false){

  const gap =
    S(Math.max(155,190-score*1.5));

  const ground=S(82);

  const minY=S(75)+gap/2;
  const maxY=H-ground-S(70)-gap/2;

  let center;

  if(first){
    center=H*.45;
  }else{
    center =
      minY+
      Math.random()*
      Math.max(10,maxY-minY);
  }

  pipes.push({

    x:W+S(30),
    width:S(68),

    gapY:center,
    gap,

    passed:false

  });
}

function pipeSpeed(){

  return S(
    Math.min(
      225,
      145+score*3
    )
  );
}

/* =========================================================
   PARTICLES
========================================================= */

function particle(x,y,vx,vy,size,life,gravity=.4){

  particles.push({
    x,y,vx,vy,
    size,
    life,
    maxLife:life,
    gravity
  });
}

function createFlapParticles(){

  for(let i=0;i<8;i++){

    particle(
      tom.x-S(15),
      tom.y+S(4),
      -Math.random()*S(80),
      (Math.random()-.5)*S(100),
      S(2+Math.random()*4),
      .4+Math.random()*.25,
      .3
    );

  }
}

function createScoreParticles(){

  for(let i=0;i<12;i++){

    particle(
      tom.x,
      tom.y,
      (Math.random()-.5)*S(120),
      -Math.random()*S(100),
      S(2+Math.random()*4),
      .7,
      .6
    );

  }
}

function updateParticles(dt){

  for(let i=particles.length-1;i>=0;i--){

    const p=particles[i];

    p.life-=dt/1000;

    p.vy+=S(300)*p.gravity*dt/1000;

    p.x+=p.vx*dt/1000;
    p.y+=p.vy*dt/1000;

    if(p.life<=0)
      particles.splice(i,1);

  }
}

function drawParticles(){

  for(const p of particles){

    ctx.globalAlpha=
      Math.max(0,p.life/p.maxLife);

    ctx.fillStyle="#fff4a3";

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

  ctx.globalAlpha=1;
}

/* =========================================================
   BACKGROUND
========================================================= */

function drawSky(){

  const gradient=ctx.createLinearGradient(
    0,0,0,H
  );

  gradient.addColorStop(0,"#38a7ff");
  gradient.addColorStop(.45,"#79d2ff");
  gradient.addColorStop(1,"#d9f5ff");

  ctx.fillStyle=gradient;
  ctx.fillRect(0,0,W,H);

  /* sunlight */

  const glow=ctx.createRadialGradient(
    W*.72,
    H*.15,
    0,
    W*.72,
    H*.15,
    S(180)
  );

  glow.addColorStop(0,"rgba(255,255,210,.75)");
  glow.addColorStop(1,"rgba(255,255,210,0)");

  ctx.fillStyle=glow;
  ctx.fillRect(0,0,W,H);

}

function drawStars(){

  for(const s of stars){

    const alpha=
      .25+
      Math.sin(elapsed*.002+s.phase)*.25;

    ctx.globalAlpha=alpha;

    ctx.fillStyle="white";

    ctx.beginPath();

    ctx.arc(
      s.x,
      s.y,
      s.r,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

  ctx.globalAlpha=1;
}

function drawClouds(dt){

  for(const c of clouds){

    c.x-=c.speed*dt/1000;

    if(c.x<-S(100))
      c.x=W+S(100);

    ctx.globalAlpha=c.alpha;

    const x=c.x;
    const y=c.y;
    const r=c.size;

    ctx.fillStyle="white";

    ctx.beginPath();

    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.arc(x+r*.8,y+r*.15,r*.7,0,Math.PI*2);
    ctx.arc(x-r*.75,y+r*.2,r*.6,0,Math.PI*2);

    ctx.fill();

  }

  ctx.globalAlpha=1;
}

function drawMountains(){

  /* distant mountains */

  ctx.fillStyle="#74b8c8";

  ctx.beginPath();

  ctx.moveTo(0,H*.62);

  for(let x=0;x<=W;x+=S(45)){

    ctx.lineTo(
      x,
      H*.62-
      Math.abs(Math.sin(x*.018))*S(65)
    );

  }

  ctx.lineTo(W,H);
  ctx.lineTo(0,H);

  ctx.fill();

  /* near mountains */

  ctx.fillStyle="#4f91a2";

  ctx.beginPath();

  ctx.moveTo(0,H*.7);

  for(let x=0;x<=W;x+=S(55)){

    ctx.lineTo(
      x,
      H*.7-
      Math.abs(Math.sin(x*.025+2))*S(80)
    );

  }

  ctx.lineTo(W,H);
  ctx.lineTo(0,H);

  ctx.fill();

}

function drawTrees(){

  const ground=H-S(82);

  for(let x=0;x<W+S(60);x+=S(45)){

    const y=ground;

    ctx.fillStyle="#245b38";

    ctx.beginPath();

    ctx.moveTo(x,y);
    ctx.lineTo(x+S(22),y-S(65));
    ctx.lineTo(x+S(44),y);

    ctx.fill();

  }

}

/* =========================================================
   PIPES — HIGH DETAIL
========================================================= */

function drawPipe(p){

  const ground=S(82);

  const top=p.gapY-p.gap/2;
  const bottom=p.gapY+p.gap/2;

  const cap=S(24);
  const over=S(7);

  /* shadows */

  ctx.shadowColor="rgba(0,0,0,.25)";
  ctx.shadowBlur=S(10);
  ctx.shadowOffsetX=S(4);
  ctx.shadowOffsetY=S(5);

  drawPipeBody(
    p.x,
    0,
    p.width,
    top,
    false
  );

  drawPipeBody(
    p.x,
    bottom,
    p.width,
    H-ground-bottom,
    true
  );

  ctx.shadowColor="transparent";
  ctx.shadowBlur=0;
  ctx.shadowOffsetX=0;
  ctx.shadowOffsetY=0;

  drawPipeCap(
    p.x-over,
    top-cap,
    p.width+over*2,
    cap
  );

  drawPipeCap(
    p.x-over,
    bottom,
    p.width+over*2,
    cap
  );
}

function drawPipeBody(x,y,w,h){

  const grad=ctx.createLinearGradient(
    x,0,x+w,0
  );

  grad.addColorStop(0,"#236c2c");
  grad.addColorStop(.18,"#54c957");
  grad.addColorStop(.48,"#8ae66b");
  grad.addColorStop(.72,"#45b947");
  grad.addColorStop(1,"#195b25");

  ctx.fillStyle=grad;

  ctx.fillRect(x,y,w,h);

  ctx.strokeStyle="#17491e";
  ctx.lineWidth=S(3);

  ctx.strokeRect(x,y,w,h);

  /* highlight */

  ctx.fillStyle="rgba(255,255,255,.25)";

  ctx.fillRect(
    x+w*.17,
    y,
    w*.12,
    h
  );

}

function drawPipeCap(x,y,w,h){

  const grad=ctx.createLinearGradient(
    x,0,x+w,0
  );

  grad.addColorStop(0,"#236c2c");
  grad.addColorStop(.25,"#62d75b");
  grad.addColorStop(.55,"#99ed76");
  grad.addColorStop(1,"#1c6028");

  ctx.fillStyle=grad;

  ctx.fillRect(x,y,w,h);

  ctx.strokeStyle="#17491e";
  ctx.lineWidth=S(3);

  ctx.strokeRect(x,y,w,h);

  ctx.fillStyle="rgba(255,255,255,.3)";

  ctx.fillRect(
    x+w*.12,
    y+S(3),
    w*.1,
    h-S(6)
  );
}

/* =========================================================
   TOM — DETAILED CHARACTER
========================================================= */

function drawTom(){

  ctx.save();

  ctx.translate(tom.x,tom.y);
  ctx.rotate(tom.rotation);

  const r=S(19);

  /* shadow */

  ctx.globalAlpha=.22;

  ctx.fillStyle="#000";

  ctx.beginPath();

  ctx.ellipse(
    0,
    r*1.35,
    r*1.2,
    r*.3,
    0,0,Math.PI*2
  );

  ctx.fill();

  ctx.globalAlpha=1;

  /* tail */

  ctx.strokeStyle="#707c91";
  ctx.lineWidth=r*.45;
  ctx.lineCap="round";

  ctx.beginPath();

  ctx.moveTo(-r*.8,r*.25);

  ctx.quadraticCurveTo(
    -r*1.9,
    -r*.5,
    -r*1.3,
    -r*1.25
  );

  ctx.stroke();

  /* body */

  const bodyGrad=ctx.createLinearGradient(
    -r,-r,
    r,r
  );

  bodyGrad.addColorStop(0,"#d5dce7");
  bodyGrad.addColorStop(.45,"#9daabd");
  bodyGrad.addColorStop(1,"#58677d");

  ctx.fillStyle=bodyGrad;

  ctx.beginPath();

  ctx.ellipse(
    0,
    0,
    r*1.15,
    r,
    0,0,Math.PI*2
  );

  ctx.fill();

  /* belly */

  ctx.fillStyle="#edf2f5";

  ctx.beginPath();

  ctx.ellipse(
    r*.15,
    r*.2,
    r*.65,
    r*.55,
    0,0,Math.PI*2
  );

  ctx.fill();

  /* ears */

  ctx.fillStyle="#9daabd";

  ctx.beginPath();

  ctx.moveTo(-r*.65,-r*.6);
  ctx.lineTo(-r*1.0,-r*1.55);
  ctx.lineTo(-r*.05,-r*1.0);
  ctx.closePath();

  ctx.fill();

  ctx.beginPath();

  ctx.moveTo(r*.55,-r*.65);
  ctx.lineTo(r*1.0,-r*1.55);
  ctx.lineTo(r*.15,-r*1.0);
  ctx.closePath();

  ctx.fill();

  /* inner ears */

  ctx.fillStyle="#ef9aaa";

  ctx.beginPath();

  ctx.moveTo(-r*.65,-r*.82);
  ctx.lineTo(-r*.82,-r*1.28);
  ctx.lineTo(-r*.35,-r*.98);
  ctx.closePath();

  ctx.fill();

  ctx.beginPath();

  ctx.moveTo(r*.6,-r*.82);
  ctx.lineTo(r*.82,-r*1.28);
  ctx.lineTo(r*.32,-r*.98);
  ctx.closePath();

  ctx.fill();

  /* eyes */

  function eye(x,y,size){

    ctx.fillStyle="white";

    ctx.beginPath();

    ctx.arc(x,y,size,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#18202d";

    ctx.beginPath();

    ctx.arc(
      x+size*.15,
      y+size*.05,
      size*.48,
      0,Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="white";

    ctx.beginPath();

    ctx.arc(
      x+size*.28,
      y-size*.12,
      size*.15,
      0,Math.PI*2
    );

    ctx.fill();

  }

  eye(r*.38,-r*.17,r*.28);
  eye(-r*.34,-r*.2,r*.22);

  /* nose */

  ctx.fillStyle="#f06c8d";

  ctx.beginPath();

  ctx.moveTo(0,r*.08);
  ctx.lineTo(r*.16,r*.2);
  ctx.lineTo(-r*.16,r*.2);
  ctx.closePath();

  ctx.fill();

  /* mouth */

  ctx.strokeStyle="#303847";
  ctx.lineWidth=S(1.5);

  ctx.beginPath();

  ctx.arc(
    0,
    r*.19,
    r*.17,
    0,
    Math.PI
  );

  ctx.stroke();

  /* whiskers */

  ctx.strokeStyle="rgba(255,255,255,.8)";
  ctx.lineWidth=S(1);

  for(let i=0;i<2;i++){

    const yy=-r*.02+i*r*.18;

    ctx.beginPath();

    ctx.moveTo(-r*.05,yy);
    ctx.lineTo(-r*1.25,yy-r*.1+i*r*.15);
    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(r*.05,yy);
    ctx.lineTo(r*1.25,yy-r*.1+i*r*.15);
    ctx.stroke();

  }

  /* wing / paw */

  ctx.fillStyle="#758398";

  ctx.beginPath();

  ctx.ellipse(
    -r*.75,
    r*.35+Math.sin(tom.wing*Math.PI)*S(4),
    r*.65,
    r*.25,
    -.5,
    0,Math.PI*2
  );

  ctx.fill();

  ctx.restore();
}

/* =========================================================
   GROUND
========================================================= */

let groundOffset=0;

function drawGround(dt){

  const y=H-S(82);

  /* dirt */

  const dirt=ctx.createLinearGradient(
    0,y,0,H
  );

  dirt.addColorStop(0,"#d8c56c");
  dirt.addColorStop(1,"#a58d42");

  ctx.fillStyle=dirt;

  ctx.fillRect(
    0,y,W,S(82)
  );

  /* grass */

  const grass=ctx.createLinearGradient(
    0,y,0,y+S(18)
  );

  grass.addColorStop(0,"#9ae45d");
  grass.addColorStop(1,"#4d9e35");

  ctx.fillStyle=grass;

  ctx.fillRect(
    0,y,W,S(17)
  );

  /* grass blades */

  ctx.fillStyle="#397c2e";

  for(let x=groundOffset;x<W+S(20);x+=S(18)){

    ctx.beginPath();

    ctx.moveTo(x,y+S(15));
    ctx.lineTo(x+S(5),y-S(2));
    ctx.lineTo(x+S(8),y+S(15));

    ctx.fill();

  }

  groundOffset -= pipeSpeed()*dt/1000;

  if(groundOffset<-S(18))
    groundOffset=0;

  /* dirt pattern */

  ctx.fillStyle="rgba(100,75,25,.2)";

  for(let x=groundOffset;x<W;x+=S(40)){

    ctx.beginPath();

    ctx.arc(
      x,
      y+S(35),
      S(3),
      0,Math.PI*2
    );

    ctx.fill();

  }
}

/* =========================================================
   UPDATE
========================================================= */

function update(dt){

  elapsed+=dt;

  updateParticles(dt);

  flash=Math.max(0,flash-dt/250);
  shake=Math.max(0,shake-dt*.05);

  if(state!=="playing")return;

  const gravity=S(1450);

  tom.vy += gravity*dt/1000;

  tom.y += tom.vy*dt/1000;

  tom.rotation=Math.max(
    -.55,
    Math.min(
      1.25,
      tom.vy/650
    )
  );

  tom.wing=Math.max(
    0,
    tom.wing-dt/180
  );

  /* ceiling */

  if(tom.y-tom.r<0){

    tom.y=tom.r;
    tom.vy=0;

  }

  /* ground */

  const ground=S(82);

  if(tom.y+S(19)>H-ground){

    tom.y=H-ground-S(19);

    gameOver();

    return;
  }

  pipeTimer+=dt;

  const interval=
    Math.max(
      1050,
      1350-score*8
    );

  if(pipeTimer>interval){

    pipeTimer=0;
    spawnPipe();

  }

  const speed=pipeSpeed();

  for(let i=pipes.length-1;i>=0;i--){

    const p=pipes[i];

    p.x-=speed*dt/1000;

    const left=
      tom.x-S(14);

    const right=
      tom.x+S(14);

    const top=p.gapY-p.gap/2;
    const bottom=p.gapY+p.gap/2;

    if(
      right>p.x &&
      left<p.x+p.width
    ){

      if(
        tom.y-S(14)<top ||
        tom.y+S(14)>bottom
      ){

        gameOver();
        return;

      }

    }

    if(
      !p.passed &&
      p.x+p.width<tom.x
    ){

      p.passed=true;

      score++;

      scoreEl.textContent=score;

      createScoreParticles();

      sound(
        700+score*15,
        .1,
        "sine"
      );

    }

    if(p.x+p.width<-S(40)){

      pipes.splice(i,1);

    }

  }
}

/* =========================================================
   RENDER
========================================================= */

function render(dt){

  ctx.clearRect(0,0,W,H);

  ctx.save();

  if(shake>0){

    ctx.translate(
      (Math.random()-.5)*shake,
      (Math.random()-.5)*shake
    );

  }

  drawSky();

  drawStars();

  drawClouds(dt);

  drawMountains();

  drawTrees();

  for(const p of pipes)
    drawPipe(p);

  drawGround(dt);

  drawParticles();

  if(tom)
    drawTom();

  ctx.restore();

  /* hit flash */

  if(flash>0){

    ctx.fillStyle=
      `rgba(255,60,60,${flash*.18})`;

    ctx.fillRect(0,0,W,H);

  }
}

/* =========================================================
   MAIN LOOP
========================================================= */

function loop(timestamp){

  if(!lastTime)
    lastTime=timestamp;

  const dt=Math.min(
    timestamp-lastTime,
    35
  );

  lastTime=timestamp;

  update(dt);
  render(dt);

  requestAnimationFrame(loop);
}

resetGame();

requestAnimationFrame(loop);

/* =========================================================
   MOBILE BROWSER PROTECTION
========================================================= */

document.addEventListener(
  "touchmove",
  e=>e.preventDefault(),
  {passive:false}
);

document.addEventListener(
  "gesturestart",
  e=>e.preventDefault()
);

})();
</script>
